<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GYM | Contacto y Pedidos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="estilos.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">
            <h1>NOVA<span>GYM</span></h1>
            <p>Entrenamiento y nutrición deportiva</p>
        </div>
    </header>

    <section class="contenedor-formulario">

        <div class="titulo">
            <h2>Solicitud de contacto / pedido</h2>
            <p>Completa los siguientes datos y nos pondremos en contacto contigo.</p>
        </div>

        <form action="#" method="post">

            <div class="grupo">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Ingrese su nombre">
            </div>

            <div class="grupo">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="ejemplo@gmail.com">
            </div>

            <div class="grupo">
                <label>Teléfono</label>
                <input type="tel" placeholder="809-000-0000">
            </div>

            <div class="grupo">
                <label>Producto de interés</label>
                <select>
                    <option>Seleccione una opción</option>
                    <option>Proteína Whey</option>
                    <option>Creatina</option>
                    <option>Pre-entreno</option>
                    <option>Asesoría nutricional</option>
                </select>
            </div>

            <div class="grupo">
                <label>Cantidad</label>
                <input type="number" min="1" placeholder="Cantidad deseada">
            </div>

            <div class="grupo">
                <label>Mensaje</label>
                <textarea rows="5" placeholder="Escribe aquí tus comentarios..."></textarea>
            </div>

            <button type="submit">
                Enviar Solicitud
            </button>

        </form>

    </section>

</body>
</html>
